services:
  kiro-go:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/data/config.json
      - STORE_BACKEND=postgres
      - DATABASE_URL=postgres://kiro:kiro_password@postgres:5432/kiro_go?sslmode=disable
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=kiro_go
      - POSTGRES_USER=kiro
      - POSTGRES_PASSWORD=kiro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
